<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account - Telling</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <main class="auth-page">
    <div class="auth-box">

      <a href="login.html" class="back-link">← Create account</a>

      <section class="card">
        <div class="auth-header">
          <div style="font-size:2.5rem">👤➕</div>
          <h2>Join Telling</h2>
          <p>Create an anonymous identity.</p>
        </div>

        <div class="notice info">
          <span>🛡️</span>
          <span>Telling is an 18+ service. You must be at least 18 years old to create an account.</span>
        </div>

        <div class="notice warn">
          <span>⚠️</span>
          <span>Your username cannot be changed after account creation. Please choose carefully.</span>
        </div>

        <form id="signupForm" novalidate>

          <div class="form-group">
            <div class="field">
              <span class="icon">🎂</span>
              <input type="date" id="dob" />
            </div>
            <p class="error" id="dobError"></p>
          </div>

          <div class="form-group">
            <div class="field">
              <span class="icon">@</span>
              <input type="text" id="username" placeholder="Username" maxlength="20" autocomplete="off" />
            </div>
            <p class="counter" id="usernameCounter">0/20</p>
            <p class="error" id="usernameError"></p>
          </div>

          <div class="form-group">
            <div class="field">
              <span class="icon">🔒</span>
              <input type="password" id="password" placeholder="Password" autocomplete="new-password" />
              <button type="button" class="toggle-pass" data-target="password">👁️</button>
            </div>
            <p class="error" id="passwordError"></p>
          </div>

          <div class="form-group">
            <div class="field">
              <span class="icon">🔁</span>
              <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" />
              <button type="button" class="toggle-pass" data-target="confirmPassword">👁️</button>
            </div>
            <p class="error" id="confirmError"></p>
          </div>

          <div class="form-group">
            <label class="check-row">
              <input type="checkbox" id="ageCheck" />
              <span>I confirm that I am 18 years of age or older.</span>
            </label>
          </div>

          <div class="form-group">
            <label class="check-row">
              <input type="checkbox" id="termsCheck" />
              <span>I agree to the <a href="#">Terms of Service</a>.</span>
            </label>
          </div>

          <div class="form-group">
            <label class="check-row">
              <input type="checkbox" id="privacyCheck" />
              <span>I acknowledge the <a href="#">Privacy Policy</a>.</span>
            </label>
            <p class="error" id="checkError"></p>
          </div>

          <button type="submit" class="btn">Create Account</button>
        </form>

        <p class="switch-text">Already have an account? <a href="login.html">Log in</a></p>
      </section>

    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
